name: Module Tests

# 只跑「本次改动涉及的模块」的测试，不依赖 macOS 原生产物，
# 用来给 fork PR 提供一条几秒到几十秒就能出结果的快速反馈。
on:
  pull_request:
  push:
    branches: [main, 'upstream/**', 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 找出改动的模块
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            mods=$(ls -d modules/*/ | xargs -n1 basename | tr '\n' ' ')
          else
            mods=$(git diff --name-only "$base" HEAD -- modules | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi
          echo "modules=$mods" >> "$GITHUB_OUTPUT"
          echo "本次涉及：$mods"
      - name: 取回插件源码
        if: steps.changed.outputs.modules != ''
        run: git clone -q --depth 1 --branch release/1.3.0 https://github.com/accomplish07zrh-eng/dsh-aurabot-qq "$RUNNER_TEMP/plugin"
      - name: 跑改动模块的测试
        if: steps.changed.outputs.modules != ''
        env:
          AURABOT_PLUGIN_DIR: ${{ runner.temp }}/plugin
        run: |
          for m in ${{ steps.changed.outputs.modules }}; do
            [ -d "modules/$m/test" ] || continue
            echo "::group::modules/$m"
            node --import ./scripts/plugin-env.mjs --test "modules/$m/test/*.test.mjs"
            echo "::endgroup::"
          done
      - name: 校验模块格式与能力声明
        run: node scripts/check.mjs
