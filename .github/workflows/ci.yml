name: CI

on:
  pull_request:
  push:
    # 模块拆分分支（upstream/<module>）在 fork 上 push 时也跑一遍，
    # 这样开 PR 前就能拿到 check/pack 结果。
    branches: [main, 'upstream/**', 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

# 同一个 PR 或分支只保留最新一次：连续推送时取消旧 run，避免排队堆积。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  companion-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: modules/companion-bond
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 从公开源码构建相伴养成 Mac 窗口
        run: npm run build:native --prefix modules/companion-bond
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-bond-native
          path: modules/companion-bond/.runtime/native/
          include-hidden-files: true
          if-no-files-found: error

  check:
    needs: companion-native
    runs-on: ubuntu-latest
    env:
      # 模块测试和作息/饥饿曲线按东八区设计；runner 默认 UTC 会让依赖本地时间的用例偶发失败。
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 取回同一次 CI 的相伴养成 Mac 构建产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: companion-bond-native
          path: modules/companion-bond/.runtime/native
      - run: npm test
      - name: 校验模块
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch -q origin "$BASE_REF"
            node scripts/check.mjs --base FETCH_HEAD
          else
            node scripts/check.mjs
          fi
      - name: 跑模块自己的测试
        run: |
          for dir in modules/*/; do
            [ -f "$dir/package.json" ] || continue
            if node -e "process.exit(require('./$dir/package.json').scripts?.test ? 0 : 1)"; then
              (cd "$dir" && npm ci --ignore-scripts && npm test)
            fi
          done
      - name: 跑搬来的模块的测试（要插件源码）
        run: |
          # 这条线跟模块声明的 minPluginVersion 对齐：1.2.0 里没有 core/media.js，
          # 用了它的模块（mobile）测试会整个文件 import 失败。加核心接口后记得一起抬。
          git clone -q --depth 1 --branch release/1.3.0 https://github.com/accomplish07zrh-eng/dsh-aurabot-qq "$RUNNER_TEMP/plugin"
          # bambu-print 的真实浏览器 E2E 在 runner 上偶发变慢（45s 超时被杀），
          # 失败时整步重试一次，重试仍失败才判红，避免偶发卡住整条 CI。
          for attempt in 1 2; do
            if AURABOT_PLUGIN_DIR="$RUNNER_TEMP/plugin" node --import ./scripts/plugin-env.mjs --test "modules/*/test/*.test.mjs"; then
              exit 0
            fi
            if [ "$attempt" = 1 ]; then
              echo "::warning::模块测试失败，重试一次"
            fi
          done
          exit 1
      - name: 试打包
        run: node scripts/pack.mjs --out dist
